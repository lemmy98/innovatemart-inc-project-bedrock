apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: retail-store
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ui
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: carts
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders
      ports:
        # Service port (ClusterIP) and container/targetPort — VPC CNI NP matches pod port.
        - port: 80
          protocol: TCP
        - port: 8080
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
