# Terraform Bootstrap Apply (stage 0)
#
# Manages terraform/bootstrap: state bucket + GitHub Actions OIDC role.
# First-time chicken/egg: run `terraform apply` locally once if the bucket
# does not exist yet. After that, state lives in S3 and CI can update it.
#
# Backend (after first local apply, migrate with init -migrate-state):
#   bucket = TF_STATE_BUCKET
#   key    = tinyuka/bootstrap/terraform.tfstate
#
# Secrets: TF_STATE_BUCKET, AWS_ROLE_ARN (OIDC — role already exists for updates)

name: Terraform Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "terraform/bootstrap/**"
      - ".github/workflows/terraform-bootstrap.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "terraform/bootstrap/**"
      - ".github/workflows/terraform-bootstrap.yml"

concurrency:
  group: tf-bootstrap-state
  cancel-in-progress: false

env:
  TF_DIR: terraform/bootstrap
  TF_VERSION: "1.11.4"
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  plan:
    name: Bootstrap Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bedrock-bootstrap-plan

      - name: Write remote backend (bootstrap state in TF_STATE_BUCKET)
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          key          = "tinyuka/bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform fmt
        run: terraform fmt -check -recursive .

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -var-file=prod.tfvars \
            -out=tfplan \
            | tee plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-tfplan-${{ github.sha }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan.txt
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/bootstrap/plan.txt', 'utf8').slice(-65000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Bootstrap Terraform plan\n\`\`\`\n${plan}\n\`\`\``
            });

  approval:
    name: Await manual approval
    needs: plan
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Wait for approval issue
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: lemmy98
          minimum-approvals: 1
          issue-title: "APPROVE BOOTSTRAP (dev): Terraform apply for ${{ github.sha }}"
          issue-body: |
            ## Bootstrap apply waiting for approval

            - **Commit:** ${{ github.sha }}
            - **Branch:** `${{ github.ref_name }}`
            - **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Updates **state bucket + GitHub OIDC role** only (not the EKS shop stack).

            1. Review the Bootstrap Plan job / `plan.txt` artifact.
            2. Comment **`approve`** to apply.
            3. Comment **`deny`** to cancel.

  apply:
    name: Bootstrap Apply
    needs: approval
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bedrock-bootstrap-apply

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          key          = "tinyuka/bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-tfplan-${{ github.sha }}
          path: ${{ github.workspace }}/_tf_artifact

      - name: Stage plan
        working-directory: ${{ github.workspace }}
        run: |
          find _tf_artifact -name tfplan -exec cp -f {} terraform/bootstrap/tfplan \;
          test -f terraform/bootstrap/tfplan

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show outputs (safe)
        run: |
          terraform output -raw github_actions_role_arn
          terraform output -raw state_bucket_name || terraform output
