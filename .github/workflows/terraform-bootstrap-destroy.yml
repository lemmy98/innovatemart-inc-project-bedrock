# Terraform Bootstrap Destroy (stage 0 teardown)
#
# Destroys state bucket + GitHub OIDC role. ONLY after terraform/envs is gone.
# Requires typed confirm=destroy-bootstrap on workflow_dispatch.
#
# Secrets: TF_STATE_BUCKET, AWS_ROLE_ARN

name: Terraform Bootstrap Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy-bootstrap (envs stack must already be destroyed)"
        required: true
        type: string

env:
  TF_DIR: terraform/bootstrap
  TF_VERSION: "1.11.4"
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

concurrency:
  group: tf-bootstrap-state
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  guard:
    name: Confirm bootstrap destroy intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "destroy-bootstrap" ]; then
            echo "Refusing: type exactly 'destroy-bootstrap'."
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refusing: gated to main. Current: ${{ github.ref }}"
            exit 1
          fi

  plan:
    name: Bootstrap destroy plan
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bedrock-bootstrap-destroy-plan

      - name: Refuse if envs state still has resources
        run: |
          set -euo pipefail
          # If main stack state object exists and is non-trivial, block.
          if aws s3api head-object \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --key "tinyuka/prod/terraform.tfstate" 2>/dev/null; then
            SIZE=$(aws s3api head-object \
              --bucket "${{ secrets.TF_STATE_BUCKET }}" \
              --key "tinyuka/prod/terraform.tfstate" \
              --query ContentLength --output text)
            echo "envs state size=$SIZE"
            # Empty-ish state is tiny; live stacks are much larger. Soft guard:
            if [ "${SIZE:-0}" -gt 5000 ]; then
              echo "Refusing: terraform/envs state still looks populated."
              echo "Run Terraform Destroy (envs) first, then bootstrap destroy."
              exit 1
            fi
          else
            echo "No envs state object (or already removed) — OK"
          fi

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          key          = "tinyuka/bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform destroy plan
        run: |
          set -o pipefail
          terraform plan -destroy -input=false -no-color \
            -var-file=prod.tfvars \
            -out=tfplan \
            | tee plan.txt

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-tfdestroy-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan.txt
          retention-days: 5

  approval:
    name: Await manual approval
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Wait for approval issue
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: lemmy98
          minimum-approvals: 1
          issue-title: "APPROVE BOOTSTRAP DESTROY (dev): ${{ github.sha }}"
          issue-body: |
            ## Bootstrap DESTROY waiting for approval

            This deletes the **state bucket** and **GitHub OIDC role**.
            Only approve after `terraform/envs` is fully destroyed.

            - **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Comment **`approve`** or **`deny`**.

  destroy:
    name: Bootstrap Destroy
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bedrock-bootstrap-destroy

      - name: Write backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          key          = "tinyuka/bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-tfdestroy-${{ github.sha }}-${{ github.run_id }}
          path: ${{ github.workspace }}/_tf_artifact

      - name: Stage plan
        working-directory: ${{ github.workspace }}
        run: |
          find _tf_artifact -name tfplan -exec cp -f {} terraform/bootstrap/tfplan \;
          test -f terraform/bootstrap/tfplan

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Empty state bucket versions (avoid destroy hang)
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          aws s3api list-object-versions --bucket "$BUCKET" --output json \
            | python3 -c '
          import json,sys,subprocess
          d=json.load(sys.stdin)
          objs=[{"Key":o["Key"],"VersionId":o["VersionId"]} for o in d.get("Versions",[])+d.get("DeleteMarkers",[])]
          while objs:
            batch,objs=objs[:1000],objs[1000:]
            body=json.dumps({"Objects":batch,"Quiet":True})
            subprocess.run(["aws","s3api","delete-objects","--bucket","'"$BUCKET"'","--delete",body],check=False)
          ' || true

      - name: Terraform destroy (apply saved plan)
        run: terraform apply -input=false -auto-approve tfplan
