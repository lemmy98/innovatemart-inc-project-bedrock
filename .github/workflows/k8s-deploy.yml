# Deploy retail-app from k8s/ (YAML/Kustomize) onto EKS.
#
# Terraform owns AWS + ALB controller + Cluster Autoscaler + carts IRSA.
# Manual-only (workflow_dispatch): the live cluster is Deployment/StatefulSet-owned
# by the Helm release (see helm-deploy.yml), and `kubectl apply -k k8s/`
# targeting the same objects hits two separate conflicts —
#   1) Deployment/StatefulSet spec.selector is immutable, and the raw
#      manifests here vs. the Helm chart don't originate the same selector
#      unless this workflow (or a manual run) has taken ownership first.
#   2) Helm's ownership check requires the label
#      app.kubernetes.io/managed-by: Helm on resources it manages; this
#      workflow's kustomization sets managed-by: kustomize instead, so
#      whichever pipeline applies last "wins" and the other starts failing
#      its own consistency check on its next run.
# k8s/ is kept as a working, validated reference for the plain-manifest
# deployment path (kustomize build + dry-run pass in CI-adjacent checks),
# but Helm is the source of truth for the actually-running app. Only run
# this manually, and expect to reconcile ownership (see scripts/helm-up.sh)
# before the next Helm deploy if you do. See docs/architecture.md.
#
# Secrets: TF_STATE_BUCKET not required. Needs AWS_ROLE_ARN (same OIDC role).

name: K8s Deploy

on:
  workflow_dispatch:

concurrency:
  group: k8s-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  CLUSTER_NAME: project-bedrock-cluster
  NS: retail-app

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: kubectl apply -k k8s/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bedrock-k8s

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          kubectl get nodes

      - name: Sync Secrets Manager → Kubernetes Secrets
        run: ./scripts/k8s-sync-secrets.sh

      - name: Apply kustomize (k8s/)
        run: |
          kubectl apply -k k8s/

      - name: Attach carts IRSA (SA now exists)
        run: ./scripts/k8s-sync-secrets.sh

      - name: Restart carts so IRSA + region env take effect
        run: kubectl -n "$NS" rollout restart deploy/carts

      - name: Wait for rollouts
        run: |
          kubectl -n "$NS" rollout status deploy/ui --timeout=300s
          kubectl -n "$NS" rollout status deploy/catalog --timeout=300s
          kubectl -n "$NS" rollout status deploy/carts --timeout=420s
          kubectl -n "$NS" rollout status deploy/orders --timeout=300s
          kubectl -n "$NS" rollout status deploy/checkout --timeout=300s
          kubectl -n "$NS" rollout status statefulset/orders-rabbitmq --timeout=180s
          kubectl -n "$NS" get pods
          kubectl -n "$NS" describe pod -l app.kubernetes.io/name=carts | tail -40

      - name: Show shop status + Ingress
        run: |
          kubectl -n "$NS" get pods,svc,ingress,networkpolicy
          echo "----"
          kubectl -n "$NS" get ingress ui -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{"\n"}'
