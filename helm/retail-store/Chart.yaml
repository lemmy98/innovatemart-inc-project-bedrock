apiVersion: v2
name: retail-store
description: Umbrella chart for the AWS retail-store sample app (catalog, carts, orders, checkout, ui) in namespace retail-app.
type: application
version: 1.0.0
appVersion: "1.6.2"
kubeVersion: ">=1.28.0-0"

dependencies:
  - name: retail-store-sample-catalog-chart
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
    alias: catalog
  - name: retail-store-sample-cart-chart
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
    alias: carts
  - name: retail-store-sample-orders-chart
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
    alias: orders
  - name: retail-store-sample-checkout-chart
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
    alias: checkout
  - name: retail-store-sample-ui-chart
    version: 1.6.2
    repository: oci://public.ecr.aws/aws-containers
    alias: ui
