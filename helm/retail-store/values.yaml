# Committed Helm values for EKS. No database passwords here.
# Secrets Manager → catalog-db / orders-db via scripts/k8s-sync-secrets.sh (or helm-up.sh).
# Endpoints and RabbitMQ password are passed at install time (--set).

catalog:
  nameOverride: catalog
  fullnameOverride: catalog
  mysql:
    create: false
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  app:
    persistence:
      provider: mysql
      endpoint: "" # --set catalog.app.persistence.endpoint=host:3306
      database: catalog
      secret:
        create: false
        name: catalog-db

carts:
  nameOverride: carts
  fullnameOverride: carts
  dynamodb:
    create: false
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 384Mi
  serviceAccount:
    create: true
    name: carts
  app:
    persistence:
      provider: dynamodb
      dynamodb:
        tableName: bedrock-carts
        createTable: false

orders:
  nameOverride: orders
  fullnameOverride: orders
  postgresql:
    create: false
  rabbitmq:
    create: true
    persistentVolume:
      enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 384Mi
  app:
    persistence:
      provider: postgres
      endpoint: "" # --set orders.app.persistence.endpoint=host:5432
      database: orders
      secret:
        create: false
        name: orders-db
    messaging:
      provider: rabbitmq
      rabbitmq:
        secret:
          create: true
          name: orders-rabbitmq
          username: orders
          password: "" # --set at install time

checkout:
  nameOverride: checkout
  fullnameOverride: checkout
  redis:
    create: true
    persistentVolume:
      enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  app:
    persistence:
      provider: redis
    endpoints:
      orders: http://orders:80

ui:
  nameOverride: ui
  fullnameOverride: ui
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 384Mi
  service:
    type: ClusterIP
  app:
    endpoints:
      catalog: http://catalog:80
      carts: http://carts:80
      orders: http://orders:80
      checkout: http://checkout:80
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/liveness
    # Omit hostnames for ALB DNS access until a custom domain + ACM cert exist.
    hosts: []
